<h3 id="spelling: {{ d.headword }}">неправильное написание: {{d.headword}}</h3>
<div class='dpd'>
    <p>
        {% for spelling in d.spellings: %}
        неправильное написание <b><i>{{spelling}}</i></b>
        {% if not loop.last: %}
        <br>
        {% endif %}
        {% endfor %}
    </p>
</div>
